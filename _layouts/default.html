<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <title>{{ page.title }} · Practice</title>
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Practice home">
          <span class="brand-mark" aria-hidden="true">◯</span>
          <span>Practice</span>
        </a>
        <nav aria-label="Legal and support">
          <a href="{{ '/privacy/' | relative_url }}">Privacy Policy</a>
          <a href="{{ '/support/' | relative_url }}">Support</a>
        </nav>
      </div>
    </header>
    <main id="content" class="content">
      {{ content }}
    </main>
    <footer class="site-footer">
      <p>© 2026 Myroslava Verbytska · Practice - Meditation timer</p>
    </footer>
  </body>
</html>
